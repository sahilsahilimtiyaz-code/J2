name: Build Jarvis APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Configure stable signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/jarvis-signing.keystore"
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "Using repository signing secrets for APK signing."
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$key_path"
            chmod 600 "$key_path"
            {
              echo "JARVIS_KEYSTORE_PATH=$key_path"
              echo "JARVIS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "JARVIS_KEY_ALIAS=$KEY_ALIAS"
              echo "JARVIS_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          elif [ -f "debug.keystore.base64" ]; then
            echo "Using committed debug.keystore.base64 for consistent in-place APK updates."
            tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > "$key_path"
            cp "$key_path" debug.keystore
            chmod 600 "$key_path" debug.keystore
            {
              echo "JARVIS_KEYSTORE_PATH=$key_path"
              echo "JARVIS_KEYSTORE_PASSWORD=android"
              echo "JARVIS_KEY_ALIAS=androiddebugkey"
              echo "JARVIS_KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
          else
            echo "Warning: No signing key found; falling back to default debug keystore."
          fi

      - name: Run unit tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Verify APK is signed
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
