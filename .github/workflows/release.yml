name: Publish Octa-Jarvis release

# Builds a signed APK, publishes it as a GitHub Release, rewrites site/version.json
# so every installed app sees "update available", and deploys the download site.
# Run it from Actions -> "Publish Octa-Jarvis release" -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes shown in the app update popup"
        required: false
        default: "Octa-Jarvis maintenance release."
      min_supported_version_code:
        description: "Builds below this versionCode are told the update is required (0 = optional)"
        required: false
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: octa-jarvis-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, release, refresh site manifest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Configure stable signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/octa-jarvis-signing.keystore"
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$key_path"
            chmod 600 "$key_path"
            {
              echo "JARVIS_KEYSTORE_PATH=$key_path"
              echo "JARVIS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "JARVIS_KEY_ALIAS=$KEY_ALIAS"
              echo "JARVIS_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          elif [ -f "debug.keystore.base64" ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > "$key_path"
            chmod 600 "$key_path"
            {
              echo "JARVIS_KEYSTORE_PATH=$key_path"
              echo "JARVIS_KEYSTORE_PASSWORD=android"
              echo "JARVIS_KEY_ALIAS=androiddebugkey"
              echo "JARVIS_KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key configured; the APK will not install over an existing copy."
          fi

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          run_number="${GITHUB_RUN_NUMBER:-0}"
          version_code=$((100 + run_number))
          version_name="1.0.${run_number}"
          {
            echo "version_code=$version_code"
            echo "version_name=$version_name"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v${version_name} (versionCode ${version_code})"

      - name: Run unit tests and build APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: Octa-Jarvis v${{ steps.version.outputs.version_name }}
          body: ${{ github.event.inputs.release_notes }}
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

      - name: Refresh site/version.json
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          NOTES: ${{ github.event.inputs.release_notes }}
          MIN_SUPPORTED: ${{ github.event.inputs.min_supported_version_code }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          checksum=$(sha256sum "$apk" | awk '{print $1}')
          jq -n \
            --argjson versionCode "${VERSION_CODE}" \
            --arg versionName "${VERSION_NAME}" \
            --arg releaseNotes "${NOTES}" \
            --arg releasedAt "$(date -u +%Y-%m-%d)" \
            --arg sha256 "${checksum}" \
            --argjson minSupportedVersionCode "${MIN_SUPPORTED:-0}" \
            '{
              versionCode: $versionCode,
              versionName: $versionName,
              apkUrl: "https://github.com/sahilsahilimtiyaz-code/J2/releases/latest/download/app-debug.apk",
              downloadPageUrl: "https://sahilsahilimtiyaz-code.github.io/J2/",
              releaseNotes: $releaseNotes,
              releasedAt: $releasedAt,
              sha256: $sha256,
              minSupportedVersionCode: $minSupportedVersionCode
            }' > site/version.json
          cat site/version.json

      - name: Commit refreshed manifest
        run: |
          set -euo pipefail
          branch="${{ github.event.repository.default_branch }}"
          git config user.name "octa-jarvis-bot"
          git config user.email "actions@github.com"
          git add site/version.json
          if git diff --cached --quiet; then
            echo "Manifest unchanged."
            exit 0
          fi
          git commit -m "chore(site): publish Octa-Jarvis v${{ steps.version.outputs.version_name }} update manifest"
          git push origin "HEAD:${branch}"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-site:
    name: Deploy Octa-Jarvis download site
    needs: build-and-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
